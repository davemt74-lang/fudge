name: Fudge Donuts Ops CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fudge-ops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, curl, pdo_mysql
      - name: Run release checks
        run: bash tests/run.sh
